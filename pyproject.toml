[project]
name = "qa-workspace"
version = "0.1.0"
description = "Questionnaire Evidence & Review Workspace (Provectus take-home, Alternative C)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=2.28,<3",
  "pydantic>=2.13,<3",
  "streamlit>=1.65,<2",
  "python-dotenv>=1.0",
]

[project.scripts]
qa = "qa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa"]

[tool.pytest.ini_options]
testpaths = ["tests", "reference"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["starter-pack", "data/seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
